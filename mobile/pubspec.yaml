name: ai_lawyer_mobile
description: AI Lawyer Mobile Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # DI & Architecture
  get_it: ^7.6.4
  injectable: ^2.3.2
  dartz: ^0.10.1
  
  # Networking
  dio: ^5.3.3
  
  # Storage
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  
  # UI & Assets
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.2
  flutter_markdown: ^0.7.3
  
  # Navigation
  go_router: ^17.1.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  injectable_generator: ^2.4.1

flutter:
  generate: true
  uses-material-design: true

